# Anubis bot policy for the Drupal site.
#
# Installed by packer/ansible/playbook.yml next to the pinned Anubis RPM, so
# the (data)/ import paths always match the binary that reads them. Started by
# /opt/anubis-setup.sh from cloud-init as anubis@drupal.
#
# Upstream's default policy (/usr/share/doc/anubis/botPolicies.yaml in the
# RPM) with two changes:
#   - The geoip and asns WEIGH rules are dropped. Both need a paid Thoth
#     subscription this site does not have.
#   - The store is bbolt, not memory. Upstream says memory is for testing only
#     and has no size limit. bbolt is still per instance, which is why the load
#     balancer's HTTPS rule uses SourceIP affinity: a challenge must be solved
#     on the instance that issued it. The pass cookie is signed with the shared
#     Key Vault key, so after a pass any instance accepts it.
#
# /health and /drupal-media/ never reach Anubis: Apache excludes them before
# the ProxyPass. See docs/TODO.md, "bot protection".

bots:
  - import: (data)/bots/_deny-pathological.yaml
  - import: (data)/bots/aggressive-brazilian-scrapers.yaml

  # Deny AI/LLM crawlers that say what they are.
  - import: (data)/meta/ai-block-aggressive.yaml

  # Google, Bing, Apple, DuckDuckGo, the Internet Archive and others, checked
  # by user agent AND source IP range.
  - import: (data)/crawlers/_allow-good.yaml
  - import: (data)/clients/x-firefox-ai.yaml
  - import: (data)/crawlers/xai.yaml

  # /.well-known/, favicon, /robots.txt, /sitemap.xml
  - import: (data)/common/keep-internet-working.yaml

  # Anything claiming to be a browser gets weight and so a challenge. A client
  # that does not claim to be a browser (curl, the CI smoke test) is ALLOWed
  # at weight 0 unless a rule above denies it.
  - name: generic-browser
    user_agent_regex: >-
      Mozilla|Opera
    action: WEIGH
    weight:
      adjust: 10

dnsbl: false

honeypot:
  enabled: true
  implementation: naive

openGraph:
  enabled: false
  considerHost: false
  ttl: 24h

status_codes:
  CHALLENGE: 200
  DENY: 200

# /var/lib/anubis/drupal is the unit's StateDirectory (anubis@.service uses
# DynamicUser, so nothing else can write there).
store:
  backend: bbolt
  parameters:
    path: /var/lib/anubis/drupal/anubis.bdb

thresholds:
  - name: minimal-suspicion
    expression: weight <= 0
    action: ALLOW

  - name: mild-suspicion
    expression:
      all:
        - weight > 0
        - weight < 10
    action: CHALLENGE
    challenge:
      algorithm: metarefresh
      difficulty: 1

  - name: moderate-suspicion
    expression:
      all:
        - weight >= 10
        - weight < 20
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 2

  - name: mild-proof-of-work
    expression:
      all:
        - weight >= 20
        - weight < 30
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 4

  - name: extreme-suspicion
    expression: weight >= 30
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 6
