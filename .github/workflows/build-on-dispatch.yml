name: Build on Dispatch

# Triggered by repository_dispatch from the app repository.
# Event type: drupal-dev-merge (push to the `dev` branch in the app repo)
#
# Payload (client_payload):
#   - drupal_repo: Git clone URL
#   - drupal_ref:  Branch to check out (dev)
#   - drupal_sha:  Full commit SHA
#   - bootstrap_build: "true" to build the image only, from vanilla Drupal.
#       Omit it for every real dev-merge. See "Validate dispatch payload" below.
#
# NOTE ON CONCURRENCY: there is deliberately no workflow-level concurrency block.
# A run-wide cancel tears down every job including deploy-dev mid-`terraform
# apply`, which leaves an unreleasable infinite blob lease on the state file and
# can orphan a half-replaced VM. Instead each job declares its own group below:
# the build is safe to supersede, the apply must queue.

on:
  repository_dispatch:
    types: [drupal-dev-merge]

permissions:
  id-token: write
  contents: read

env:
  # Terraform authenticates with the GitHub OIDC token. There is no
  # ARM_CLIENT_SECRET; the service principal has no password credential.
  ARM_USE_OIDC: true
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

  TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_location: ${{ vars.LOCATION }}
  TF_VAR_cost_center: ${{ vars.COST_CENTER }}
  TF_VAR_admin_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_gallery_name: ${{ vars.GALLERY_NAME }}
  TF_VAR_gallery_resource_group_name: ${{ vars.GALLERY_RESOURCE_GROUP }}
  TF_VAR_image_name: ${{ vars.APP_IMAGE_NAME }}
  TF_VAR_subnet_id: ${{ vars.SUBNET_ID }}
  TF_VAR_devtest_db_host: ${{ vars.DEVTEST_DB_HOST }}
  TF_VAR_devtest_storage_account: ${{ vars.DEVTEST_STORAGE_ACCOUNT }}
  TF_VAR_tfstate_resource_group_name: ${{ vars.TF_STATE_RESOURCE_GROUP }}
  TF_VAR_tfstate_storage_account_name: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}

jobs:
  # ---------------------------------------------------------------------------
  # Build the app image from the app repository
  # ---------------------------------------------------------------------------
  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    # Safe to supersede: image versions are unique (0.0.{run_number}) and a
    # cancelled build skips deploy-dev via `needs`.
    concurrency:
      group: dev-merge-build
      cancel-in-progress: true
    outputs:
      image_version: ${{ steps.version.outputs.version }}
      bootstrap: ${{ steps.validate.outputs.bootstrap }}

    steps:
      - name: Checkout infrastructure code
        uses: actions/checkout@v7.0.1

      - name: Validate dispatch payload
        id: validate
        env:
          DRUPAL_REPO: ${{ github.event.client_payload.drupal_repo }}
          DRUPAL_REF: ${{ github.event.client_payload.drupal_ref }}
          DRUPAL_SHA: ${{ github.event.client_payload.drupal_sha }}
          BOOTSTRAP_BUILD: ${{ github.event.client_payload.bootstrap_build }}
        run: |
          echo "Event type: ${{ github.event.action }}"
          echo "Drupal repo: $DRUPAL_REPO"
          echo "Drupal ref: $DRUPAL_REF"
          echo "Drupal SHA: $DRUPAL_SHA"

          # Normalise the flag to a string ONCE, here, and let the downstream jobs
          # gate on this output rather than on client_payload directly.
          #
          # Both a JSON boolean true and the string "true" arrive at this shell as
          # `true`, so the test below cannot tell them apart -- but a job-level
          # `if:` can. GitHub coerces mismatched types to numbers before comparing,
          # and while `true` casts to 1, the string 'true' casts to NaN. So
          # `true != 'true'` evaluates to `1 != NaN`, which is *true*: a boolean
          # payload would sail straight past a guard written against the string.
          # Job outputs are always strings, so the comparison downstream is exact.
          if [ "$BOOTSTRAP_BUILD" = "true" ]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$DRUPAL_REPO" ]; then
            exit 0
          fi

          # Packer and the Ansible playbook already fall back to
          # `composer create-project` when drupal_repo is empty -- that is how the
          # very first image gets built, before the app repo has any dispatch
          # workflows to send a real payload. Nothing else could produce the first
          # version of the app image definition.
          #
          # That fallback is actively wrong for a real dev-merge, though: it would
          # quietly bake vanilla Drupal and ship it over the actual site. So an
          # empty repo is only honoured when the caller says it meant it.
          if [ "$BOOTSTRAP_BUILD" = "true" ]; then
            echo "::warning::Bootstrap build: no drupal_repo, installing vanilla Drupal via Composer."
            exit 0
          fi

          echo "::error::Missing drupal_repo in payload"
          exit 1

      - name: Generate version
        id: version
        run: |
          echo "version=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building image version: 0.0.${{ github.run_number }}"

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3.4.0
        with:
          version: latest

      - name: Azure Login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve base image version
        id: base_version
        env:
          # The base image and the gallery are SHARED with lib-main-infra, which
          # owns and rebuilds them monthly. Set the BASE_IMAGE_VERSION repo
          # variable to pin a known-good base instead of tracking latest.
          PINNED: ${{ vars.BASE_IMAGE_VERSION }}
          GALLERY: ${{ vars.GALLERY_NAME }}
          GALLERY_RG: ${{ vars.GALLERY_RESOURCE_GROUP }}
          BASE_IMAGE: ${{ vars.BASE_IMAGE_NAME }}
        run: |
          if [ -n "$PINNED" ]; then
            echo "Using pinned base image version: $PINNED"
            echo "version=$PINNED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Querying the shared gallery for the newest base image..."
          # Versions are zero-padded YYYY.MM.0, so a lexicographic sort is a
          # correct chronological sort.
          VERSION=$(az sig image-version list \
            --gallery-name "$GALLERY" \
            --gallery-image-definition "$BASE_IMAGE" \
            --resource-group "$GALLERY_RG" \
            --query "sort_by([].name, &@)[-1]" -o tsv)

          if [ -z "$VERSION" ]; then
            echo "::error::No base image found in the shared gallery ($GALLERY_RG/$GALLERY/$BASE_IMAGE)."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using base image version: $VERSION"

      - name: Build image
        working-directory: packer
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
          BASE_IMAGE_VERSION: ${{ steps.base_version.outputs.version }}
          DRUPAL_REPO: ${{ github.event.client_payload.drupal_repo }}
          DRUPAL_REF: ${{ github.event.client_payload.drupal_ref }}
        run: |
          packer init .
          packer build \
            -force \
            -only='mccarthy-rocky9*' \
            -var "subscription_id=$ARM_SUBSCRIPTION_ID" \
            -var "use_azure_cli_auth=true" \
            -var "site_name=${{ vars.PROJECT_NAME }}" \
            -var "image_version=$IMAGE_VERSION" \
            -var "base_image_name=${{ vars.BASE_IMAGE_NAME }}" \
            -var "base_image_version=$BASE_IMAGE_VERSION" \
            -var "gallery_resource_group_name=${{ vars.GALLERY_RESOURCE_GROUP }}" \
            -var "gallery_name=${{ vars.GALLERY_NAME }}" \
            -var "image_name=${{ vars.APP_IMAGE_NAME }}" \
            -var "location=${{ vars.LOCATION }}" \
            -var "replication_regions=[\"${{ vars.LOCATION }}\"]" \
            -var "drupal_repo=$DRUPAL_REPO" \
            -var "drupal_ref=$DRUPAL_REF" \
            .

      - name: Build Summary
        run: |
          {
            echo "## Image Build Complete"
            echo ""
            echo "**Event Type:** ${{ github.event.action }}"
            echo "**Image Version:** ${{ steps.version.outputs.version }}"
            echo "**Base Image Version:** ${{ steps.base_version.outputs.version }}"
            echo "**Drupal Repo:** ${{ github.event.client_payload.drupal_repo }}"
            echo "**Drupal Ref:** ${{ github.event.client_payload.drupal_ref }}"
            echo "**Drupal SHA:** ${{ github.event.client_payload.drupal_sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Sync the production database into devtest
  # ---------------------------------------------------------------------------
  prepare-database:
    name: Prepare Database
    needs: build-image
    # A bootstrap build stops at the image. Everything below this point reads
    # from production, which does not exist yet when the first image is built.
    # Gate on the normalised job output, never on client_payload directly -- see
    # the type-coercion note in build-image's validate step.
    if: ${{ needs.build-image.outputs.bootstrap != 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: devtest-database
      cancel-in-progress: false

    steps:
      - name: Azure Login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start PostgreSQL if stopped
        env:
          SERVER_NAME: ${{ vars.PROJECT_NAME }}-devtest-psql
          RG: ${{ vars.PROJECT_NAME }}-devtest-rg
        run: |
          # Query server state with retries (the Azure API returns transient
          # GatewayTimeouts against a deallocated Flexible Server).
          STATE=""
          for attempt in {1..5}; do
            STATE=$(az postgres flexible-server show \
              --name "$SERVER_NAME" --resource-group "$RG" \
              --query "state" -o tsv 2>&1) && break
            echo "Failed to query PostgreSQL state (attempt $attempt/5): $STATE"
            sleep 15
          done

          if [ -z "$STATE" ] || echo "$STATE" | grep -qi "error"; then
            echo "::error::Unable to query PostgreSQL server state after 5 attempts: $STATE"
            exit 1
          fi

          echo "Current PostgreSQL state: $STATE"

          if [ "$STATE" != "Ready" ]; then
            echo "Starting PostgreSQL server..."
            az postgres flexible-server start --name "$SERVER_NAME" --resource-group "$RG"

            for i in {1..60}; do
              STATE=$(az postgres flexible-server show \
                --name "$SERVER_NAME" --resource-group "$RG" \
                --query "state" -o tsv)
              if [ "$STATE" == "Ready" ]; then
                echo "PostgreSQL is ready (attempt $i)"
                break
              fi
              echo "Waiting for PostgreSQL... (attempt $i/60, state: $STATE)"
              sleep 10
            done

            if [ "$STATE" != "Ready" ]; then
              echo "::error::PostgreSQL failed to start after 10 minutes"
              exit 1
            fi
          fi

      - name: Sync production database to devtest
        env:
          PGSSLMODE: require
          PROD_HOST: ${{ vars.PROD_DB_HOST }}
          DEVTEST_HOST: ${{ vars.DEVTEST_DB_HOST }}
          DB_USER: ${{ vars.DB_ADMIN_USERNAME }}
          DB_NAME: ${{ vars.DB_NAME }}
          SECRETS_RG: ${{ vars.PROJECT_NAME }}-secrets-rg
          PG_MAJOR: ${{ vars.PG_MAJOR || '18' }}
        run: |
          # Install the client from PGDG pinned to the server's major version.
          # Ubuntu 24.04 ships client 16, and pg_dump hard-refuses to read a server
          # with a newer major than itself (no override; --ignore-version is long
          # gone), so the distro default cannot dump our PostgreSQL 18 servers.
          #
          # PG_MAJOR is the single source of truth: it also feeds
          # TF_VAR_postgresql_version in the production deploys, so the client and
          # the server cannot drift apart. Its fallback mirrors the Terraform
          # default in modules/postgresql/variables.tf.
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --yes --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}"

          # Production and devtest share one admin password today, so one fetch.
          KV_NAME=$(az keyvault list -g "$SECRETS_RG" --query "[0].name" -o tsv)
          DB_PASSWORD=$(az keyvault secret show --vault-name "$KV_NAME" \
            --name production-db-admin-password --query value -o tsv)
          echo "::add-mask::$DB_PASSWORD"
          export PGPASSWORD="$DB_PASSWORD"

          echo "Dumping production database..."
          pg_dump -h "$PROD_HOST" -U "$DB_USER" -d "$DB_NAME" \
            --format=custom --no-owner --no-acl -f /tmp/production.dump

          echo "Terminating existing connections to the devtest database..."
          psql -h "$DEVTEST_HOST" -U "$DB_USER" -d postgres \
            -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$DB_NAME' AND pid <> pg_backend_pid();" || true

          echo "Dropping and recreating the devtest database..."
          psql -h "$DEVTEST_HOST" -U "$DB_USER" -d postgres -c "DROP DATABASE IF EXISTS $DB_NAME;"
          psql -h "$DEVTEST_HOST" -U "$DB_USER" -d postgres -c "CREATE DATABASE $DB_NAME;"

          echo "Restoring the production dump into devtest..."
          pg_restore -h "$DEVTEST_HOST" -U "$DB_USER" -d "$DB_NAME" \
            --no-owner --no-acl /tmp/production.dump

          echo "Ensuring the pg_trgm extension exists..."
          psql -h "$DEVTEST_HOST" -U "$DB_USER" -d "$DB_NAME" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

          echo "Database sync complete"
          rm -f /tmp/production.dump

  # ---------------------------------------------------------------------------
  # Sync production blob media into devtest
  # ---------------------------------------------------------------------------
  sync-blob-storage:
    name: Sync Blob Storage
    needs: build-image
    if: ${{ needs.build-image.outputs.bootstrap != 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: devtest-blob-storage
      cancel-in-progress: false

    steps:
      - name: Azure Login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate SAS tokens
        id: sas
        env:
          PROD_SA: ${{ vars.PROD_STORAGE_ACCOUNT }}
          DEVTEST_SA: ${{ vars.DEVTEST_STORAGE_ACCOUNT }}
        run: |
          EXPIRY=$(date -u -d '+1 hour' '+%Y-%m-%dT%H:%MZ')

          PROD_SAS=$(az storage account generate-sas \
            --account-name "$PROD_SA" \
            --permissions rl --resource-types co --services b \
            --expiry "$EXPIRY" -o tsv)
          echo "::add-mask::$PROD_SAS"
          echo "prod_sas=$PROD_SAS" >> "$GITHUB_OUTPUT"

          DEVTEST_SAS=$(az storage account generate-sas \
            --account-name "$DEVTEST_SA" \
            --permissions rwdlac --resource-types co --services b \
            --expiry "$EXPIRY" -o tsv)
          echo "::add-mask::$DEVTEST_SAS"
          echo "devtest_sas=$DEVTEST_SAS" >> "$GITHUB_OUTPUT"

      - name: Sync blobs from production to devtest
        env:
          PROD_SA: ${{ vars.PROD_STORAGE_ACCOUNT }}
          DEVTEST_SA: ${{ vars.DEVTEST_STORAGE_ACCOUNT }}
          CONTAINER: ${{ vars.MEDIA_CONTAINER }}
        run: |
          azcopy sync \
            "https://${PROD_SA}.blob.core.windows.net/${CONTAINER}?${{ steps.sas.outputs.prod_sas }}" \
            "https://${DEVTEST_SA}.blob.core.windows.net/${CONTAINER}?${{ steps.sas.outputs.devtest_sas }}" \
            --recursive \
            --delete-destination=true

      - name: Sync Summary
        run: |
          {
            echo "## Blob Storage Sync Complete"
            echo ""
            echo "**Source:** ${{ vars.PROD_STORAGE_ACCOUNT }}/${{ vars.MEDIA_CONTAINER }}"
            echo "**Destination:** ${{ vars.DEVTEST_STORAGE_ACCOUNT }}/${{ vars.MEDIA_CONTAINER }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Deploy the shared dev VM
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy Dev
    needs: [build-image, prepare-database, sync-blob-storage]
    if: ${{ needs.build-image.outputs.bootstrap != 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    # Never cancelled: a superseded run QUEUES behind this one rather than
    # killing it mid-apply. See the note at the top of this file.
    concurrency:
      group: dev-merge-deploy
      cancel-in-progress: false
    outputs:
      dev_vm_ip: ${{ steps.outputs.outputs.public_ip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false

      - name: Azure Login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: environments/dev
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Apply
        working-directory: environments/dev
        run: |
          terraform apply -auto-approve \
            -var="image_version=${{ needs.build-image.outputs.image_version }}" \
            -replace="module.dev_vm.azurerm_linux_virtual_machine.dev"

      - name: Get Outputs
        id: outputs
        working-directory: environments/dev
        run: |
          echo "public_ip=$(terraform output -raw public_ip_address)" >> "$GITHUB_OUTPUT"

      - name: Run Dev Validation Tests
        run: |
          DEV_IP="${{ steps.outputs.outputs.public_ip }}"
          echo "Testing health endpoint on $DEV_IP..."

          for i in {1..30}; do
            if curl -ksf "https://${DEV_IP}/health"; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Waiting for VM... (attempt $i/30)"
            sleep 10
          done

          echo "Health check failed after 30 attempts"
          exit 1

      - name: Surface cloud-init logs
        if: always() && steps.outputs.outputs.public_ip != ''
        env:
          VM_NAME: ${{ vars.PROJECT_NAME }}-dev-vm
          DEV_RG: ${{ vars.PROJECT_NAME }}-dev-rg
        run: |
          {
            echo "## Cloud-Init Errors"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          OUTPUT=$(az vm run-command invoke \
            --command-id RunShellScript \
            --name "$VM_NAME" \
            --resource-group "$DEV_RG" \
            --scripts "grep -iE '(error|fatal|fail|warning)' /var/log/cloud-init-output.log; echo \"GREP_EXIT=\$?\"" \
            --query "value[0].message" -o tsv 2>&1)

          echo "$OUTPUT"
          {
            echo "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # grep exits 0 only when it actually matched something
          if echo "$OUTPUT" | grep -q "GREP_EXIT=0"; then
            echo "::error::Errors detected in cloud-init logs (see step summary)"
            exit 1
          fi

      - name: Dev Deploy Summary
        if: always() && steps.outputs.outputs.public_ip != ''
        run: |
          {
            echo "## Dev Environment Deployed"
            echo ""
            echo "**Dev Site URL:** https://${{ steps.outputs.outputs.public_ip }}"
            echo "**Image Version:** ${{ needs.build-image.outputs.image_version }}"
            echo "**Drupal SHA:** ${{ github.event.client_payload.drupal_sha }}"
            echo ""
            echo "After verifying the dev site, open a PR from dev to main to deploy to production."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch Postmark token from Key Vault
        if: always() && steps.outputs.outputs.public_ip != ''
        env:
          SECRETS_RG: ${{ vars.PROJECT_NAME }}-secrets-rg
        run: |
          KV_NAME=$(az keyvault list -g "$SECRETS_RG" --query "[0].name" -o tsv)
          TOKEN=$(az keyvault secret show --vault-name "$KV_NAME" \
            --name shared-postmark-api-token --query value -o tsv)
          echo "::add-mask::$TOKEN"
          echo "POSTMARK_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Email Notification - Dev VM Ready
        if: always() && steps.outputs.outputs.public_ip != ''
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.postmarkapp.com
          server_port: 587
          username: ${{ env.POSTMARK_TOKEN }}
          password: ${{ env.POSTMARK_TOKEN }}
          subject: "Dev VM Ready - ${{ steps.outputs.outputs.public_ip }}"
          to: ${{ vars.NOTIFY_EMAIL_TO }}
          from: ${{ vars.NOTIFY_EMAIL_FROM }}
          body: |
            Dev VM deployed successfully.

            Site URL: https://${{ steps.outputs.outputs.public_ip }}
            Image Version: ${{ needs.build-image.outputs.image_version }}
            Drupal SHA: ${{ github.event.client_payload.drupal_sha }}

            View workflow run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true
