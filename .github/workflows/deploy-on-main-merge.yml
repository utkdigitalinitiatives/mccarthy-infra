name: Deploy on Main Merge

# Triggered by repository_dispatch from the app repository.
# Event type: drupal-main-merge (push to the `main` branch in the app repo)
#
# Payload (client_payload):
#   - drupal_sha: Full commit SHA (audit trail)
#
# Also supports a manual trigger for cleanup-only or pinned-version deploys.

on:
  repository_dispatch:
    types: [drupal-main-merge]
  workflow_dispatch:
    inputs:
      cleanup_only:
        description: 'Only destroy the dev VM, skip the production deploy'
        required: false
        default: false
        type: boolean
      image_version:
        description: 'Override image version (optional; queries the gallery if empty)'
        required: false
        type: string

# Production applies queue, never cancel.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: true
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

jobs:
  # ---------------------------------------------------------------------------
  # Resolve which image version to deploy
  # ---------------------------------------------------------------------------
  get-image-version:
    name: Get Image Version
    if: ${{ github.event_name == 'repository_dispatch' || !inputs.cleanup_only }}
    runs-on: ubuntu-latest
    outputs:
      image_version: ${{ steps.version.outputs.image_version }}

    steps:
      - name: Azure Login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get latest image version
        id: version
        env:
          OVERRIDE: ${{ inputs.image_version }}
          GALLERY: ${{ vars.GALLERY_NAME }}
          GALLERY_RG: ${{ vars.GALLERY_RESOURCE_GROUP }}
          APP_IMAGE: ${{ vars.APP_IMAGE_NAME }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            echo "image_version=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Using manual image version: $OVERRIDE"
            exit 0
          fi

          echo "Querying the shared gallery for the newest app image..."
          # Sorted by publish date rather than name: app versions are
          # 0.0.{run_number}, which does not sort correctly as a string once the
          # run number reaches three digits (0.0.99 > 0.0.100 lexicographically).
          VERSION=$(az sig image-version list \
            --gallery-name "$GALLERY" \
            --gallery-image-definition "$APP_IMAGE" \
            --resource-group "$GALLERY_RG" \
            --query "sort_by([], &publishingProfile.publishedDate)[-1].name" -o tsv)

          if [ -z "$VERSION" ]; then
            echo "::error::No $APP_IMAGE image found in the shared gallery"
            exit 1
          fi

          echo "image_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest image version: $VERSION"

  # ---------------------------------------------------------------------------
  # Roll the image onto the production VMSS
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: get-image-version
    if: ${{ github.event_name == 'repository_dispatch' || !inputs.cleanup_only }}
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
      TF_VAR_storage_prefix: ${{ vars.STORAGE_PREFIX }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_location: ${{ vars.LOCATION }}
      TF_VAR_cost_center: ${{ vars.COST_CENTER }}
      TF_VAR_tfstate_resource_group_name: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_VAR_tfstate_storage_account_name: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_VAR_use_gallery_image: "true"
      TF_VAR_gallery_name: ${{ vars.GALLERY_NAME }}
      TF_VAR_gallery_resource_group_name: ${{ vars.GALLERY_RESOURCE_GROUP }}
      TF_VAR_image_name: ${{ vars.APP_IMAGE_NAME }}
      TF_VAR_lb_dns_label: ${{ vars.LB_DNS_LABEL }}
      TF_VAR_admin_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_enable_vmss_blob_access: "true"
      TF_VAR_drupal_site_uuid: ${{ vars.DRUPAL_SITE_UUID }}
      TF_VAR_enable_https: "true"
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_public_ip_id: ${{ vars.PUBLIC_IP_ID }}
      # Same PG_MAJOR that pins the pg_dump client in build-on-dispatch.yml, so the
      # server major and the client major cannot drift apart.
      TF_VAR_postgresql_version: ${{ vars.PG_MAJOR || '18' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Azure Login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: environments/production
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Plan
        working-directory: environments/production
        run: |
          terraform plan \
            -var="image_version=${{ needs.get-image-version.outputs.image_version }}" \
            -out=tfplan

      - name: Terraform Apply (Rolling Update)
        working-directory: environments/production
        run: terraform apply -auto-approve tfplan

      - name: Get VMSS Details
        id: vmss
        working-directory: environments/production
        run: |
          {
            echo "vmss_name=$(terraform output -raw vmss_name)"
            echo "vmss_id=$(terraform output -raw vmss_id)"
            echo "resource_group_name=$(terraform output -raw resource_group_name)"
            echo "application_url=$(terraform output -raw application_url)"
          } >> "$GITHUB_OUTPUT"

      - name: Monitor Rolling Update
        run: |
          echo "Monitoring rolling update for VMSS: ${{ steps.vmss.outputs.vmss_name }}"

          for i in {1..60}; do
            STATUS=$(az vmss get-instance-view \
              --name "${{ steps.vmss.outputs.vmss_name }}" \
              --resource-group "${{ steps.vmss.outputs.resource_group_name }}" \
              --query "statuses[?code=='ProvisioningState/succeeded'].code" \
              -o tsv 2>/dev/null || echo "pending")

            if [ "$STATUS" == "ProvisioningState/succeeded" ]; then
              echo "Rolling update completed successfully!"
              break
            fi

            echo "Update in progress... (check $i/60)"
            sleep 30
          done

      - name: Health Check
        run: |
          # The health endpoint is exempt from the HTTPS redirect, so plain HTTP
          # is checked to avoid a cert-warmup race on a freshly imaged instance.
          if [ -n "${{ vars.DOMAIN_NAME }}" ]; then
            HEALTH_URL="http://${{ vars.DOMAIN_NAME }}/health"
          else
            HEALTH_URL="${{ steps.vmss.outputs.application_url }}/health"
          fi

          echo "Running health check against $HEALTH_URL"
          for i in {1..10}; do
            if curl -sf "$HEALTH_URL" > /dev/null; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Waiting for healthy response... (attempt $i/10)"
            sleep 30
          done

          echo "::error::Health check did not pass within timeout"
          exit 1

      - name: Deployment Summary
        if: always() && steps.vmss.outputs.application_url != ''
        run: |
          {
            echo "## Production Deployment Complete"
            echo ""
            echo "**Image Version:** ${{ needs.get-image-version.outputs.image_version }}"
            echo "**VMSS:** ${{ steps.vmss.outputs.vmss_name }}"
            echo "**Application URL:** ${{ steps.vmss.outputs.application_url }}"
            echo "**Drupal SHA:** ${{ github.event.client_payload.drupal_sha }}"
            echo ""
            echo "Rolling update completed. Verify the application at the URL above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch Postmark token from Key Vault
        if: always() && steps.vmss.outputs.application_url != ''
        env:
          SECRETS_RG: ${{ vars.PROJECT_NAME }}-secrets-rg
        run: |
          KV_NAME=$(az keyvault list -g "$SECRETS_RG" --query "[0].name" -o tsv)
          TOKEN=$(az keyvault secret show --vault-name "$KV_NAME" \
            --name shared-postmark-api-token --query value -o tsv)
          echo "::add-mask::$TOKEN"
          echo "POSTMARK_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Email Notification - Production Deploy
        if: always() && steps.vmss.outputs.application_url != ''
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.postmarkapp.com
          server_port: 587
          username: ${{ env.POSTMARK_TOKEN }}
          password: ${{ env.POSTMARK_TOKEN }}
          subject: "Production Deploy ${{ job.status == 'success' && 'Complete' || 'Failed' }} - ${{ needs.get-image-version.outputs.image_version }}"
          to: ${{ vars.NOTIFY_EMAIL_TO }}
          from: ${{ vars.NOTIFY_EMAIL_FROM }}
          body: |
            Production deployment ${{ job.status }}.

            Application URL: ${{ steps.vmss.outputs.application_url }}
            Image Version: ${{ needs.get-image-version.outputs.image_version }}
            Drupal SHA: ${{ github.event.client_payload.drupal_sha }}

            View workflow run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Destroy the dev VM once production is live
  # ---------------------------------------------------------------------------
  cleanup-dev:
    name: Cleanup Dev VM
    needs: deploy-production
    if: ${{ always() && (needs.deploy-production.result == 'success' || inputs.cleanup_only) }}
    runs-on: ubuntu-latest
    env:
      TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_location: ${{ vars.LOCATION }}
      TF_VAR_cost_center: ${{ vars.COST_CENTER }}
      TF_VAR_tfstate_resource_group_name: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_VAR_tfstate_storage_account_name: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_VAR_admin_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_gallery_name: ${{ vars.GALLERY_NAME }}
      TF_VAR_gallery_resource_group_name: ${{ vars.GALLERY_RESOURCE_GROUP }}
      TF_VAR_image_name: ${{ vars.APP_IMAGE_NAME }}
      TF_VAR_subnet_id: ${{ vars.SUBNET_ID }}
      TF_VAR_devtest_db_host: ${{ vars.DEVTEST_DB_HOST }}
      TF_VAR_devtest_storage_account: ${{ vars.DEVTEST_STORAGE_ACCOUNT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false

      - name: Azure Login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: environments/dev
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Destroy
        working-directory: environments/dev
        run: |
          terraform destroy -auto-approve -refresh=false \
            -var="image_version=latest"

      - name: Cleanup Summary
        run: |
          {
            echo "## Dev Environment Cleaned Up"
            echo ""
            echo "Dev VM and resources destroyed after a successful production deployment."
          } >> "$GITHUB_STEP_SUMMARY"
